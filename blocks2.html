        if(zy3!==p.y){
          if(zy3>p.y){
            zy3--
            
          }else{
            zy3++
          }
        }

        

        $("#z1").attr("style", "position:absolute; top: "+zy1*16+"px; left: "+zx1*16+"px;")
        $("#z2").attr("style", "position:absolute; top: "+zy2*16+"px; left: "+zx2*16+"px;")
        $("#z3").attr("style", "position:absolute; top: "+zy3*16+"px; left: "+zx3*16+"px;")
        if((zy1==p.y) && (zx1==p.x) && zstat.z1){
          console.log("oy")
          p.takeDamage(3)
          
          
        }
        if((zy2==p.y) && (zx2==p.x) && zstat.z2){
          console.log("oy")
          p.takeDamage(3)
          
          
        }
        if((zy3==p.y) && (zx3==p.x) && zstat.z3){
          console.log("oy")
          p.takeDamage(3)
          
          
        }
      },2000)
      setInterval(function(){
        day = (day+1)>30?1:(day+1)
        $("#time").text(month+"-"+day+"-"+year)
        var sts = Math.floor(3*Math.random())
        for(let i = 0; i<sts; i++){
          spawnAnimal("sheep")
        }
        var pts = Math.floor(3*Math.random())
        for(let i = 0; i<pts; i++){
          spawnAnimal("pig")
        }
      }, 48000)
      setInterval(function(){
        month = (month+1)>12?1:(month+1)
        $("#time").text(month+"-"+day+"-"+year)
      }, 1440000)
      setInterval(function(){
        year++
        $("#time").text(month+"-"+day+"-"+year)
      }, 17280000)
      setTimeout(function(){
        $("#cc").append("<img src='zombie.png' class='zombie' id='z1' onclick='kb(1)' style='position:absolute; top:1024px; left: 1024px;'>" )
      },60000)
      var kb = function(t){
        window["zx"+String(t)]++
        $("#z"+t).attr("style", "position:absolute; top: "+window["zy"+String(t)]*16+"px; left: "+window["zx"+String(t)]*16+"px;")
        window["zh"+String(t)]-=p.dmg
        if(window["zh"+String(t)]<=0){
            $("#z"+t).remove()
            alert("You beat a zombie!")
            zstat["z"+t] = false
            noz--
            p.$ += 10
            $("#cash").text(p.$)
          }
      }
      var hs = function(el, t){
        window["sx"+String(t)]++
        $("#sheep"+t).attr("style", "position:absolute; top: "+window["sy"+String(t)]*16+"px; left: "+window["sx"+String(t)]*16+"px;")
        window["sh"+String(t)]-=p.dmg
        if(window["sh"+String(t)]<=0){
            $("#sheep"+t).remove()
            alert("You killed a sheep. You got a piece of wool.")
            p.inv.wool++
            $("#woolCount").text(p.inv.wool)
            sstat["s"+t] = false
            nos--
            
          }
      }
      var hp = function(el, t){
        window["px"+String(t)]++
        $("#pig"+t).attr("style", "position:absolute; top: "+window["py"+String(t)]*16+"px; left: "+window["px"+String(t)]*16+"px;")
        window["ph"+String(t)]-=p.dmg
        if(window["ph"+String(t)]<=0){
            $("#pig"+t).remove()
            alert("You killed a pig. You got a piece of raw pork.")
            p.inv.rawPork++
            $("#rawPorkCount").text(p.inv.rawPork)
            $("#wbc").append("<img src='raw-pork.png' class='pork 1x1-icon' onclick='cookPork(this)'/>")
            pstat["p"+t] = false
            nop--
            
          }
      }

      function cut(a,b){
        if(b=="spruce"){
          a.remove()
            var n = Math.floor(Math.random()*5)+1
            alert("You got "+n+" wood.")
            p.inv.wood += n
            $("#woodCount").text(p.inv.wood)
          return
        }
        var q = prompt("Would you like to cut or harvest from the "+b+" tree? (say 'cut' or 'harvest')")
        switch(q){
          case "cut":
            a.remove()
            var n = Math.floor(Math.random()*5)+1
            alert("You got "+n+" wood.")
            p.inv.wood += n
            $("#woodCount").text(p.inv.wood)
            break
          case "harvest":
            setTimeout(function(){
              var n = Math.floor(Math.random()*5)+1
            alert("You got "+n+" apples.")
            p.inv.apples += n
            $("#appleCount").text(p.inv.apples)
            }, 1000)
            break
        }
      }
      $("#eatApple").click(function(){
        if(p.inv.apples==0){
          return
        }
        p.inv.apples--
        $("#appleCount").text(p.inv.apples)
        p.genHP(3)
      })
      $("#eatMaxApples").click(function(){
        if(p.inv.apples==0){
          return
        }
        p.genHP(3*p.inv.apples)
        p.inv.apples=0
        $("#appleCount").text(p.inv.apples)
        
      })
      $("#tSound").click(function(){
        soundStatus = !soundStatus
        if(soundStatus){
          document.getElementById("theme").play()
          $("#soundStatus").text("on")
        }else{
          document.getElementById("theme").pause()
          $("#soundStatus").text("off")
        }
      })
    </script>
