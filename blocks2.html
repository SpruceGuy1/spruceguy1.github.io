      function up(){
        p.y--
        $("#player").css("top", 16*p.y+"px")
      }
      function down(){
        p.y++
        $("#player").css("top", 16*p.y+"px")
      }
      function left(){
        p.x--
        $("#player").css("left", 16*p.x+"px")
      }
      function right(){
        p.x++
        $("#player").css("left", 16*p.x+"px")
      }
      $("#up").click(up)
      $("#down").click(down)
      $("#left").click(left)
      $("#right").click(right)
