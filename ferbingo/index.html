<!doctype html>
<html lang="en">

<head>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
  </script>
</head>

<body>
  <img src="/images/ferbingo/logo.png" style="height: 40px; width: 160px" alt="Ferbingo logo" />
  <fieldset>
    <legend>Log-In</legend>
    <form id="login">
      <label>
        Login Email
        <input id="log-email" type="email" required />
      </label>
      <label>
        Password
        <input id="log-pword" type="password" required />
      </label>
      <button type="submit">Log In</button>
    </form>
    <form id="register">
      <label>
        Register Email
        <input id="reg-email" type="email" required />
      </label>
      <label>
        Password
        <input id="reg-pword" type="password" required />
      </label>
      <button type="submit">Register</button>
    </form>
    <button id="save-btn" type="button" disabled>
      Save Progress To Your Account
    </button>
    <button id="load-btn" type="button" disabled>
      Get Your Saved Progress
    </button>
    <div id="status" role="status" aria-live="polite">Loading modules...</div>
  </fieldset>
  <fieldset>
    <legend>Questions</legend>
    <p id="skill">Translation</p>
    <select id="choose-skill">
      <option value="translation">Translation</option>
      <option value="vocab">Vocabulary</option>
      <option value="orthography">Orthography</option>
      <option value="pronunciation">Pronunciation</option>
      <option id="inflection">Inflection</option>
    </select>
    <div id="questions"></div>
    <p id="answer-area"></p>
    <button id="check">Check answer</button>
    <p id="qstatus">Not answered yet</p>
  </fieldset>
  <script type="module">
    import questions from "./questions.json" with { type: "json" };
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAeINE31darFq72BB4N1WtWDARk9YPxJzY",
      authDomain: "sapient-origin-462411-t7.firebaseapp.com",
      projectId: "sapient-origin-462411-t7",
      storageBucket: "sapient-origin-462411-t7.firebasestorage.app",
      messagingSenderId: "749880999520",
      appId: "1:749880999520:web:9246df43f9ecb2279fcd05",
      measurementId: "G-2HT9YKBXV4",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const status = document.getElementById("status");
    const saveButton = document.getElementById("save-btn");
    const loadButton = document.getElementById("load-btn");

    let currentUser = null;
    let questionProgress = {
      vocab: 0,
      orthography: 0,
      translation: 0,
      inflection: 0,
      pronunciation: 0,
    };

    function getGameData() {
      return {
        version: 1,
        questionProgress,
        lastSaved: new Date().toISOString(),
      };
    }

    function applyGameData(data) {
      const isPlainObject =
        data?.questionProgress !== null &&
        typeof data?.questionProgress === "object" &&
        !Array.isArray(data.questionProgress);

      if (
        data?.version !== 1 ||
        !isPlainObject ||
        typeof data.lastSaved !== "string"
      ) {
        throw new Error("invalid-save-data");
      }

      questionProgress = data.questionProgress;
      render();
    }

    function showFirebaseError(action, error) {
      const code = error?.code || "unknown-error";
      status.textContent = `${action} error: ${code}`;
    }

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      saveButton.disabled = !user;
      loadButton.disabled = !user;
      status.textContent = user
        ? `Signed in as ${user.email}.`
        : "Not signed in.";
    });

    document
      .getElementById("register")
      .addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = document.getElementById("reg-email").value;
        const password = document.getElementById("reg-pword").value;

        try {
          const credential = await createUserWithEmailAndPassword(
            auth,
            email,
            password,
          );
          status.textContent = `Registered as ${credential.user.email}.`;
        } catch (error) {
          showFirebaseError("Registration", error);
        }
      });

    document
      .getElementById("login")
      .addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = document.getElementById("log-email").value;
        const password = document.getElementById("log-pword").value;

        try {
          const credential = await signInWithEmailAndPassword(
            auth,
            email,
            password,
          );
          status.textContent = `Signed in as ${credential.user.email}.`;
        } catch (error) {
          showFirebaseError("Login", error);
        }
      });

    saveButton.addEventListener("click", async () => {
      if (!currentUser) return;
      status.textContent = "Saving game...";

      try {
        await setDoc(
          doc(db, "ferbingo_saves", currentUser.uid),
          getGameData(),
        );
        status.textContent = "Game progress saved.";
      } catch (error) {
        showFirebaseError("Save", error);
      }
    });

    loadButton.addEventListener("click", async () => {
      if (!currentUser) return;
      status.textContent = "Loading game...";

      try {
        const snapshot = await getDoc(
          doc(db, "ferbingo_saves", currentUser.uid),
        );

        if (!snapshot.exists()) {
          status.textContent = "No Ferbingo save found for this account.";
          return;
        }

        const data = snapshot.data();
        applyGameData(data);
        status.textContent = `Loaded save from ${data.lastSaved}.`;
      } catch (error) {
        if (error.message === "invalid-save-data") {
          status.textContent =
            "Save data is invalid or uses an unsupported version.";
        } else {
          showFirebaseError("Load", error);
        }
      }
    });

    var skill = "translation";
    $("#choose-skill").change(function () {
      skill = $("#choose-skill").val();
      var name;
      if (skill === "vocab") {
        name = "Vocabulary";
      } else {
        name = skill.charAt(0).toUpperCase() + skill.slice(1);
      }
      $("#skill").text(name);
      render();
    });
    function render() {
      const currentQuestion = questions[skill]?.[questionProgress[skill]];

      if (!currentQuestion) {
        $("#questions").text("No questions available.");
        $("#answer-area").empty();
        $("#qstatus").text("No questions available for this skill.");
        $("#check").prop("disabled", true);
        return;
      }

      $("#qstatus").text("Not answered yet");
      $("#check").prop("disabled", false);
      $("#check").text("Check answer");

      if (currentQuestion.information) {
        $("#questions").html(currentQuestion.information);
        $("#answer-area").html('<button id="go-back">Go Back</button>');
        $("#check").text("Continue");
        return;
      }

      $("#questions").text(currentQuestion.q);
      if (currentQuestion.rega) {
        $("#answer-area").html("<input id='userAnswer'>");
      } else {
        $("#answer-area").empty();
      }
    }
    $("#check").click(function () {
      const skillQuestions = questions[skill];
      const currentQuestion = skillQuestions?.[questionProgress[skill]];
      if (currentQuestion.information) {
        if (questionProgress.vocab < questions.vocab.length - 1) {
          questionProgress.vocab++;
        }
        render();
        return;
      }
      if (!currentQuestion?.rega) return;

      var regex = new RegExp(currentQuestion.rega, currentQuestion.flags);
      if (regex.test($("#userAnswer").val())) {
        $("#qstatus").text("Correct answer!");
        questionProgress[skill]++;
        if (questionProgress[skill] >= skillQuestions.length) {
          $("#questions").text("All questions completed.");
          $("#answer-area").empty();
          $("#qstatus").text("Skill complete!");
          $("#check").prop("disabled", true);
        } else {
          render();
        }
      }
    });
    $("#answer-area").on("click", "#go-back", function () {
      if (questionProgress.vocab > 0) {
        questionProgress.vocab--;
      }
      render();
    });
    render();
  </script>
</body>

</html>
