<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferbingo Cule</title>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
  </head>
  <body>
    <h1>-cle, -gle, -ple, -ble</h1>
    <div id="results"></div>
    <script type="module">
      import words from "https://raw.githubusercontent.com/words/an-array-of-english-words/refs/heads/master/index.json" with { type: "json" };
      const results = document.getElementById("results");
      var test = [];
      for (let i of words) {
        if (i.endsWith("ular")) {
          var str = i;
          const base = i.slice(0, -4);
          if (words.includes(base + "le")) {
            str += " " + base + "le";
          }
          if (words.includes(base + "ule")) {
            str += " " + base + "ule";
          }
          if (words.includes(base + "ulus")) {
            str += " " + base + "ulus";
          }
          if (words.includes(base + "ulum")) {
            str += " " + base + "ulum";
          }
          if (words.includes(base + "ula")) {
            str += " " + base + "ula";
          }
          test.push(str)
          results.append(str, document.createElement("br"));
        }
      }
      console.log(test);
    </script>
  </body>
</html>
