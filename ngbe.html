class Block{
	constructor(x,y,z,material,data,stateOfMatter){

		this.material=material
		this.data = data;
		this.stateOfMatter = stateOfMatter;

	}
	remove(){
		this.material=new Block("air",{});

		if(this.material="tree"){
			player.inventory.push("log","log","log","log","log","log","tree")
			player.newDesignInventory.wood+=6
			player.newDesignInventory.trees++

		}
		if(this.material="fruit tree"){
			player.inventory.push("apple","apple","apple","apple","apple","log","log","log","log","log","log","log","log","log","tree")
			player.newDesignInventory.apples+=5
			player.newDesignInventory.wood+=9
			player.newDesignInventory.fruit_trees++
		}
	}
	place(material,data){
		if(this.material=="air"){
			this.material=material;
			this.data = data;
			if(material == "tree"){
				player.newDesignInventory.trees--
			}
			if(material == "fruit tree"){
				player.newDesignInventory.fruit_trees--
			}
			if(material == "wood"){
				player.newDesignInventory.wood--
			}

		}else{
			console.log("error placing block")
		}
	}
}
