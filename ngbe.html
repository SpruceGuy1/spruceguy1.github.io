    function serializeBba() {
      const serialized = {};

      for (const [x, xData] of Object.entries(bba)) {
        for (const [y, yData] of Object.entries(xData)) {
          for (const [z, blockData] of Object.entries(yData)) {
            serialized[`${x},${y},${z}`] = blockData;
          }
        }
      }

      return serialized;
    }

    function deserializeBba(serialized) {
      const restored = [];

      for (const [key, blockData] of Object.entries(serialized || {})) {
        const [x, y, z] = key.split(",").map(Number);

        restored[x] ??= [];
        restored[x][y] ??= [];
        restored[x][y][z] = blockData;
      }

      return restored;
    }
    function serializeMba() {
      const serialized = {};

      for (const [x, xData] of Object.entries(mba)) {
        for (const [y, yData] of Object.entries(xData)) {
          for (const [z, blockData] of Object.entries(yData)) {
            serialized[`${x},${y},${z}`] = blockData;
          }
        }
      }

      return serialized;
    }

    function deserializeMba(serialized) {
      const restored = [];

      for (const [key, blockData] of Object.entries(serialized || {})) {
        const [x, y, z] = key.split(",").map(Number);

        restored[x] ??= [];
        restored[x][y] ??= [];
        restored[x][y][z] = blockData;
      }

      return restored;
    }

      document.getElementById("status").innerText = "Saving data securely...";

        const userSaveRef = doc(db, "player_saves", currentUser.uid);

        console.error("Save error:", error);
        document.getElementById("status").innerText =
          "Failed to write to database.";

    window.loadGameData = async function () {
      if (!currentUser) return;

      try {
        const userSaveRef = doc(db, "player_saves", currentUser.uid);
        const docSnap = await getDoc(userSaveRef);

            player.fishingrod = new Rod(0, 0);

          bba = deserializeBba(data.bba);
          mba = deserializeMba(data.mba);

            path.clear();
            data.path.forEach((key) => path.add(key));
          }
          if (data.temples) {
            temples.clear();
            data.temples.forEach((key) => temples.add(key));
          }
          document.getElementById("status").innerText =
            `Loaded save from ${data.lastSaved}`;

      const biomeValue = biomeNoise.perlin2(x / BIOME_SCALE, z / BIOME_SCALE);

        bba[x][y][z].biome = "water";
      } else if (biomeValue < 0) {
        bba[x][y][z].biome = "plains";

    function hasPath(x, z) {
      return path.has(pathKey(x, z));
    }

    function generatePathsFromOrigin(ox, oz, flag) {
      path.add(pathKey(ox, oz));
      var random;
      var seedCounter = ox * 73856093 + oz * 19349663;
      function randomize3() {
        random =
          Math.floor(Math.abs(pathNoise.simplex2(seedCounter++, 0)) * 3) % 3;
        //randomizes to 0, 1, or 2
      }
      function randomize4() {
        random =
          Math.floor(Math.abs(pathNoise.simplex2(seedCounter++, 0)) * 4) % 4;
        //randomizes to 0, 1, 2, or 3
      }

      var x = ox;
      var z = oz;
      randomize4();
      var dir = random;
      for (let i = 0; i < 30; i++) {
        randomize3();

        switch (random) {
          case 0:
            switch (dir) {
              case 0:
                x++;
                dir = 2;
                break;
              default:
                z++;
                dir = 0;
            }
            break;
          case 1:
            switch (dir) {
              case 1:
                z++;
                dir = 0;
                break;
              default:
                z--;
                dir = 1;
            }
            break;
          case 2:
            switch (dir) {
              case 2:
                z--;
                dir = 1;
                break;
              default:
                x++;
                dir = 2;
            }
            break;

          generatePathsFromOrigin(x, z, false);
        }
        path.add(pathKey(x, z));
      }
      temples.add(templeKey(x, z));

    class BasicBlockGenerator {
      constructor(x, y, z) {
        this.x = x;
        this.y = y;
        this.z = z;
        biomeGenerator(x, y, z);
        this.biome = bba[x][y][z].biome;

              if (random == 0) {
                this.block = "tree";
              } else {
                this.block = "air";
              }

              if (random == 0) {
                this.block = "fruit-tree";
              } else {
                this.block = "air";
              }
              break;
            default:
              this.block = "air";
              break;
          }
        } else if (y > 6) {
          this.block = "air";
        } else if (y == 4) {
          this.block = "dirt";
        } else if (y == 5) {
          if (hasPath(x, z)) {
            this.block = "path";
          } else {
            switch (this.biome) {
              case "water":
                this.block = "water";
                break;

              case "plains":
                this.block =
                  Math.floor(Math.random() * 2) === 0 ? "dirt" : "grass";
                break;

              case "forest":
              case "fruitForest": {
                const groundRoll = Math.floor(Math.random() * 3);

                this.block =
                  groundRoll === 0
                    ? "dirt"
                    : groundRoll === 1
                      ? "grass"
                      : "moss";
                break;
              }

              default:
                this.block = "grass";
                break;
            }
          }
        } else {
          this.block = "stone";
        }
        mba[x] ??= [];
        mba[x][y] ??= [];
        mba[x][y][z] = this.block;
      }
    }

      mba[x] ??= [];
      mba[x][y] ??= [];

      const result = { x, y, z };

      if (bba[x][y][z] === undefined || mba[x][y][z] === undefined) {
        const generatedBlock = new BasicBlockGenerator(x, y, z);

        bba[x][y][z] = { biome: generatedBlock.biome };
        mba[x][y][z] = generatedBlock.block;
      }

      result.biome = bba[x][y][z].biome;
      result.block = mba[x][y][z];

      return result;
    }

        return;
