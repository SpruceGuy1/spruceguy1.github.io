function serializeBba() {
  const serialized = {};

  for (const [x, xData] of Object.entries(bba)) {
    for (const [y, yData] of Object.entries(xData)) {
      for (const [z, blockData] of Object.entries(yData)) {
        serialized[`${x},${y},${z}`] = blockData;
      }
    }
  }

  return serialized;
}

function deserializeBba(serialized) {
  const restored = [];

  for (const [key, blockData] of Object.entries(serialized || {})) {
    const [x, y, z] = key.split(",").map(Number);

    restored[x] ??= [];
    restored[x][y] ??= [];
    restored[x][y][z] = blockData;
  }

  return restored;
}
function serializeMba() {
  const serialized = {};

  for (const [x, xData] of Object.entries(mba)) {
    for (const [y, yData] of Object.entries(xData)) {
      for (const [z, blockData] of Object.entries(yData)) {
        serialized[`${x},${y},${z}`] = blockData;
      }
    }
  }

  return serialized;
}

function deserializeMba(serialized) {
  const restored = [];

  for (const [key, blockData] of Object.entries(serialized || {})) {
    const [x, y, z] = key.split(",").map(Number);

    restored[x] ??= [];
    restored[x][y] ??= [];
    restored[x][y][z] = blockData;
  }

  return restored;
}

const path = new Set();

function pathKey(x, z) {
    return `${x},${z}`;
}

function hasPath(x, z) {
    return path.has(pathKey(x, z));
}

const PATH_GROWTH_ROLLS = 6;
const PATH_GROWTH_CHANCE = 1 / 3;

const TEMPLE_CHANCE = 0.01;

function coordinateRandom(x, z, seed = 0) {
    const value = Math.sin(
        x * 12.9898 + z * 78.233 + seed * 37.719
    ) * 43758.5453;

    return value - Math.floor(value);
}

function hasTemple(x, z) {
    return hasPath(x, z) &&
        coordinateRandom(x, z, 1) < TEMPLE_CHANCE;
}

path.add(pathKey(player.coords.x, player.coords.z));

class BasicBlockGenerator{
	constructor(x,y,z){
		this.x = x
		this.y = y
		this.z = z
		biomeGenerator(x,y,z)
		this.biome = bba[x][y][z].biome
		if (
		    y === 5 &&
		    (
		        hasPath(x + 1, z) ||
		        hasPath(x, z + 1) ||
		        hasPath(x - 1, z) ||
		        hasPath(x, z - 1)
		    )
		) {
		    for (let attempt = 0; attempt < PATH_GROWTH_ROLLS; attempt++) {
		        if (Math.random() < PATH_GROWTH_CHANCE) {
		            path.add(pathKey(x, z));
		            break;
		        }
		    }
		}
		if(y==6 && hasTemple(x,z)){

					}else{

					}
					break
			}
		}else if(y>6){
			this.block="air"
		}else if(y==4){
			this.block="dirt"
		}else if(y==5){
			if (hasPath(x, z)) {
			    this.block = "path";
			} else {
				var randy = Math.floor(Math.random()*3)
				switch(randy){
					case 0:
						this.block="dirt"
						break
					case 1:
						this.block="grass"
						break
					case 2:
						this.block="moss"
						break
				}
			}
		}else{
			this.block="stone"
		}
		mba[x] ??= [];
mba[x][y] ??= [];
mba[x][y][z] = this.block;
		
	}

function getBlock(x, y, z) {
    bba[x] ??= [];
    bba[x][y] ??= [];

    mba[x] ??= [];
    mba[x][y] ??= [];

    const result = { x, y, z };

    if (bba[x][y][z] === undefined || mba[x][y][z] === undefined) {
        const generatedBlock = new BasicBlockGenerator(x, y, z);

        bba[x][y][z] = { biome: generatedBlock.biome };
        mba[x][y][z] = generatedBlock.block;
    }

    result.biome = bba[x][y][z].biome;
    result.block = mba[x][y][z];

    return result;
}
function renderSurfaceCell(cellId, x, y, z) {
	if(player.coords.y!==5){
		    $(`#${cellId}`).css("background-image", `url("images/${getBlock(x,y,z).block}.png")`);
			return
	}
    const ground = getBlock(x, 5, z).block;
    const overlay = getBlock(x, 6, z).block;

    const hasOverlay =
        overlay === "tree" ||
        overlay === "fruit-tree" ||
        overlay === "temple";

    const backgrounds = hasOverlay
        ? `url("images/${overlay}.png"), url("images/${ground}.png")`
        : `url("images/${ground}.png")`;

    $(`#${cellId}`).css("background-image", backgrounds);
}
