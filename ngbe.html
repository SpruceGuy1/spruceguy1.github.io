	  const CLIENT_ID = '749880999520-k7l7cujukqftu4ia9lb14kggd5rq9vd6.apps.googleusercontent.com';
        // SCOPE allows reading/writing ONLY to a hidden app folder on the user's drive
    const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
    
    let tokenClient = null;
    let accessToken = null;
    let gapiInitialized = false;

    // Fired automatically ONLY when api.js finishes loading
    function gapiLoaded() {
        gapi.load('client', async () => {
            try {
                await gapi.client.init({});
                gapiInitialized = true;
                checkReadyStatus();
            } catch (err) {
                console.error("Error initializing gapi client:", err);
                document.getElementById('status').innerText = "Failed to load Google client.";
            }
        });
    }

    // Fired automatically ONLY when gsi/client finishes loading
    function gisLoaded() {
        try {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse.error !== undefined) {
                        throw (tokenResponse);
                    }
                    accessToken = tokenResponse.access_token;
                    document.getElementById('save-btn').disabled = false;
                    document.getElementById('load-btn').disabled = false;
                    document.getElementById('auth-btn').innerText = "Connected";
                    document.getElementById('status').innerText = "Successfully authenticated!";
                },
            });
            checkReadyStatus();
        } catch (err) {
            console.error("Error initializing token client:", err);
        }
    }

    // Inform user when both background dependencies are active
    function checkReadyStatus() {
        if (gapiInitialized && tokenClient) {
            document.getElementById('status').innerText = "Google API Ready. Click Connect!";
        }
    }

    // Safe trigger wrapper
    function handleAuthClick() {
        if (!tokenClient) {
            document.getElementById('status').innerText = "Google scripts are still loading. Please wait...";
            return;
        }
        
        if (accessToken === null) {
            tokenClient.requestAccessToken({prompt: 'consent'});
        } else {
            tokenClient.requestAccessToken({prompt: ''});
        }
    }

    // --- GAME SAVING FUNCTIONS ---
    function getGameData() {
        return {
            player: player,
            bba: bba,
			mba: mba,
            lastSaved: new Date().toISOString()
        };
    }

    async function saveGameData() {
        if (!accessToken) return;
        document.getElementById('status').innerText = "Saving...";
        const gameData = getGameData();
        
        try {
            const searchResponse = await fetch(`https://googleapis.com'`, {
                headers: { 'Authorization': `Bearer ${accessToken}` }
            });
            const searchResult = await searchResponse.json();
            const isUpdate = Boolean(searchResult.files && searchResult.files.length > 0);
            const metadata = isUpdate
                ? { name: 'savegame.json' }
                : { name: 'savegame.json', parents: ['appDataFolder'] };

            const fileContent = JSON.stringify(gameData);
            const boundary = '34asdf92';
            const delimiter = `\r\n--${boundary}\r\n`;
            const close_delim = `\r\n--${boundary}--`;

            let url = 'https://googleapis.com';
            let method = 'POST';

            // If file exists, update it instead of creating a new one
            if (searchResult.files && searchResult.files.length > 0) {
                const fileId = searchResult.files[0].id;
                url = `https://googleapis.com{fileId}?uploadType=multipart`;
                method = 'PATCH';
            }

            const multipartRequestBody =
                delimiter +
                'Content-Type: application/json\r\n\r\n' +
                JSON.stringify(metadata) +
                delimiter +
                'Content-Type: application/json\r\n\r\n' +
                fileContent +
                close_delim;

            const response = await fetch(url, {
                method: method,
                headers: {
                    'Authorization': `Bearer ${accessToken}`,
                    'Content-Type': `multipart/related; boundary=${boundary}`
                },
                body: multipartRequestBody
            });

            if (response.ok) {
                document.getElementById('status').innerText = "Game saved successfully!";
            } else {
                document.getElementById('status').innerText = "Error saving game.";
            }
        } catch (e) {
            console.error(e);
            document.getElementById('status').innerText = "Network error while saving.";
        }
    }

    async function loadGameData() {
        if (!accessToken) return;
        document.getElementById('status').innerText = "Loading...";
        
        try {
            const searchResponse = await fetch(`https://googleapis.com'`, {
                headers: { 'Authorization': `Bearer ${accessToken}` }
            });
            const searchResult = await searchResponse.json();

            if (searchResult.files && searchResult.files.length > 0) {
                const fileId = searchResult.files[0].id; // Fixed index bug from previous block
                
                const fileResponse = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                if (!fileResponse.ok) {
                    document.getElementById('status').innerText = "Error loading save file.";
                    return;
                }
                const data = await fileResponse.json();
                player = data.player
				bba = data.bba
				mba = data.mba
                document.getElementById('status').innerText = `Loaded! Score: ${data.score}, Level: ${data.level}`;
                console.log("Loaded Game State:", data);
            } else {
                document.getElementById('status').innerText = "No save file found.";
            }
        } catch (e) {
            console.error(e);
            document.getElementById('status').innerText = "Network error while loading.";
        }
    }
