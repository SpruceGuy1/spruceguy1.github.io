<!doctype html
<html>
  <head>
    
  </head>
  <body>
    <script>
      var chords=[]
      function make(){
        chords.push((Math.floor(Math.random()*8)+1)+(Math.round(Math.random())==1?"m":"M"))
      }
      for(let i =0; i<8; i++){
        make()
      }
      for (let j of chords){
        document.body.innerText += j
      }
    </script>
  </body>
</html>
