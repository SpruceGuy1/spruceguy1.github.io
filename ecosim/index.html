<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="/ecosim/style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/eruda"></script>

    <script>
      eruda.init();
    </script>
  </head>
  <body>
    <h1>EcoSim: releasing September 2026</h1>
    <a target="_blank" href="changelog.html">Changelog</a>
    Air composition:<br />
    &bull; O2: <span id="o2count">21</span>% &bull; N2:
    <span id="n2count">78</span>% &bull; CO2: <span id="co2count">0</span>%
    &bull; Other: <span id="other">1</span>%

    <div class="game"></div>
    <script>
      /*
           
       g
       h
       */
      class Location {
        constructor(x, y) {
          this.x = x;
          this.y = y;
        }
      }
      function loc(t) {
        if (Array.isArray(t)) {
          return new Location(t[0], t[1]);
        } else {
          return new Location(t.x, t.y);
        }
      }
      var sprites = [];
      var o2 = [];
      var o2index = 0;
      var co2index = 0;
      var co2 = [];
      var index = 0;
      var co2count = 0;
      var o2count = 21;
      var n2count = 79;

      function removeFromList(list, idx) {
        if (!list.length) {
          return 0;
        }
        const removed = list.splice(idx, 1)[0];
        if (removed) {
          removed.remove();
        }
        return list.length ? idx % list.length : 0;
      }

      class Sprite {
        constructor(type, x, y, addit) {
          this.type = type;
          this.x = x;
          this.y = y;
          this.addit = addit;
          sprites[index] = this;
          this.id = "sprite" + index;
          this.num = index;
          $(".game").append(
            '<img class="sprite" src="/images/ecosim/' +
              type +
              ".png\" id='" +
              this.id +
              "'/>",
          );
          $("#" + this.id).css("top", 16 * x + "px");
          $("#" + this.id).css("left", 16 * y + "px");

          index++;
        }
        remove() {
          if (this.num !== undefined) {
            sprites[this.num] = undefined;
          }
          const el = document.getElementById(this.id);
          if (el) {
            el.remove();
          }
        }
      }
      var throwaway;
      function createSprite(location, type, addit) {
        return new Sprite(type, location.x, location.y, addit);
      }
      function getHumanLocation() {
        const human = sprites.find(
          (sprite) => sprite && sprite.type === "human",
        );
        if (human) {
          return loc(human);
        }
        return new Location(0, 0);
      }
      function init() {
        createSprite(loc([0, 0]), "human", {
          behavior: "moveRandom",
        });
        for (let i = 0; i < Math.floor(Math.random() * 164); i++) {
          createSprite(
            loc([Math.floor(Math.random() * 30), Math.random() * 30]),
            "plant",
            {},
          );
        }
      }
      init();
      setInterval(function () {
        const maxCo2Sprites = 6;

        if (co2.length >= maxCo2Sprites) {
          co2index = removeFromList(co2, co2index);
          co2count = Math.max(0, co2count - 1);
        }

        const human = getHumanLocation();
        const offset = co2.length % 4;
        const co2Location = new Location(
          human.x + (offset % 2),
          human.y + Math.floor(offset / 2),
        );

        co2.push(
          createSprite(co2Location, "co2", {
            behavior: "moveToPlant",
            plantTrigger: function () {
              const idx = co2.indexOf(this);
              if (idx >= 0) {
                co2.splice(idx, 1);
              }
              co2count = Math.max(0, co2count - 1);
              this.remove();
              o2count++;
              o2.push(
                createSprite(loc(this), "oxygen", {
                  behavior: "moveRandom",
                }),
              );
            },
          }),
        );
        co2count++;

        if (o2.length > 0) {
          o2index = removeFromList(o2, o2index);
          o2count--;
        }

        if (n2count <= 78) {
          n2count++;
        }

        o2count -= 0.5;
        n2count -= 0.5;

        var fn = function () {
          for (let i of sprites) {
            if (!i) {
              continue;
            }
            if (i.addit && i.addit.behavior) {
              switch (i.addit.behavior) {
                case "moveRight":
                  i.x++;
                  $("#" + i.id).css("left", 16 * i.x + "px");
                  break;
                case "moveRandom":
                  switch (Math.floor(Math.random() * 4)) {
                    case 0:
                      i.x++;
                      $("#" + i.id).css("left", 16 * i.x + "px");
                      break;
                    case 1:
                      i.x--;
                      $("#" + i.id).css("left", 16 * i.x + "px");
                      i.y++;
                      $("#" + i.id).css("top", 16 * i.y + "px");
                      break;
                    case 2:
                      i.y++;
                      $("#" + i.id).css("top", 16 * i.y + "px");
                      break;
                    case 3:
                      i.y--;
                      $("#" + i.id).css("top", 16 * i.y + "px");
                      break;
                  }
                  break;
                case "moveToPlant": {
                  let nearestPlant = null;
                  let nearestDistance = Infinity;

                  for (const sprite of sprites) {
                    if (!sprite || sprite.type !== "plant") {
                      continue;
                    }
                    const distance =
                      Math.abs(i.x - sprite.x) + Math.abs(i.y - sprite.y);
                    if (distance < nearestDistance) {
                      nearestDistance = distance;
                      nearestPlant = sprite;
                    }
                  }

                  if (nearestPlant) {
                    if (i.x < nearestPlant.x) {
                      i.x++;
                    } else if (i.x > nearestPlant.x) {
                      i.x--;
                    }
                    if (i.y < nearestPlant.y) {
                      i.y++;
                    } else if (i.y > nearestPlant.y) {
                      i.y--;
                    }
                    $("#" + i.id).css("left", 16 * i.x + "px");
                    $("#" + i.id).css("top", 16 * i.y + "px");
                  }

                  if (
                    i.addit.plantTrigger &&
                    nearestPlant &&
                    i.x === nearestPlant.x &&
                    i.y === nearestPlant.y
                  ) {
                    i.addit.plantTrigger.call(i);
                  }
                  break;
                }
              }
            }
            if (!i.addit) {
              console.error(i);
            }
          }
        };
        fn();
        $("#o2count").text(o2count);
        $("#co2count").text(co2count);
        $("#n2count").text(n2count);
      }, 1000);
    </script>
  </body>
</html>
