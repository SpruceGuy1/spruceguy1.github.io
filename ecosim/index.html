<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="/ecosim/style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/eruda"></script>

    <script>
      eruda.init();
    </script>
  </head>
  <body>
    <h1>EcoSim: releasing September 2026</h1>
    <a target="_blank" href="changelog.html">Changelog</a>
    Air composition:<br />
    &bull; O2: <span id="o2count">21</span>% &bull; N2:
    <span id="n2count">78</span>% &bull; CO2: <span id="co2count">0</span>%
    &bull; Other: <span id="other">1</span>%

    <div class="game">
      <img class="sprite" src="/images/ecosim/human.png" />
    </div>
    <script>
      class Location {
        constructor(x, y) {
          this.x = x;
          this.y = y;
        }
      }
      function loc(t) {
        if (Array.isArray(t)) {
          return new Location(t[0], t[1]);
        } else {
          return new Location(t.x, t.y);
        }
      }
      var sprites = [];
      var index = 0;
      var co2count = 0;
      var o2count = 21;
      var n2count = 79;
      class Sprite {
        constructor(type, x, y, addit) {
          this.type = type;
          this.x = x;
          this.y = y;
          this.addit = addit;
          sprites[index] = this;
          this.id = "sprite" + index;
          $("#game").append(
            '<img class="sprite" href="/images/ecosim/' +
              type +
              ".png\" id='" +
              this.id +
              "'/>",
          );
          $("#" + this.id).css("top", 16 * x + "px");
          $("#" + this.id).css("left", 16 * y + "px");

          index++;
        }
      }
      function createSprite(location, type, addit) {
        new Sprite(type, location.x, location.y, addit);
        console.log("Sprite created!");
      }
      function init() {
        createSprite(loc([0, 0]), "human", {});
        console.log("Game initialized!");
      }
      init();
      setInterval(function () {
        createSprite(loc(sprites[0]), "co2", {
          behavior: "moveRight",
        });
        co2count++;
        o2count -= 0.5;
        n2count -= 0.5;
        $("#o2count").text(o2count);
        $("#co2count").text(co2count);
        $("#n2count").text(n2count);

        for (i of sprites) {
          if (i.addit.behavior) {
            switch (i.addit.behavior) {
              case "moveRight":
                i.x++;
                $("#" + i.id).css("left", 16 * i.x + "px");
                console.log("motion");
            }
          }
        }
      }, 1000);
    </script>
  </body>
</html>
