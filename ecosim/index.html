<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="/ecosim/style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/eruda"></script>

    <script>
      eruda.init();
    </script>
  </head>
  <body>
    <h1>EcoSim: releasing September 2026</h1>
    <a target="_blank" href="changelog.html">Changelog</a>
    Air composition:<br />
    &bull; O2: <span id="o2count">21</span>% &bull; N2:
    <span id="n2count">78</span>% &bull; CO2: <span id="co2count">0</span>%
    &bull; Other: <span id="other">1</span>%

    <div class="game"></div>
    <script>
      /*
           
       g
       h
       */
      class Location {
        constructor(x, y) {
          this.x = x;
          this.y = y;
        }
      }
      function loc(t) {
        if (Array.isArray(t)) {
          return new Location(t[0], t[1]);
        } else {
          return new Location(t.x, t.y);
        }
      }
      var sprites = [];
      var o2 = [];
      var o2index = 0;
      var co2index = 0;
      var co2 = [];
      var index = 0;
      var co2count = 0;
      var o2count = 21;
      var n2count = 79;
      class Sprite {
        constructor(type, x, y, addit) {
          this.type = type;
          this.x = x;
          this.y = y;
          this.addit = addit;
          sprites[index] = this;
          this.id = "sprite" + index;
          this.num = index;
          $(".game").append(
            '<img class="sprite" src="/images/ecosim/' +
              type +
              ".png\" id='" +
              this.id +
              "'/>",
          );
          $("#" + this.id).css("top", 16 * x + "px");
          $("#" + this.id).css("left", 16 * y + "px");

          index++;
        }
        remove() {
          sprites[this.num] = undefined;
          $("#" + this.id).remove();
        }
      }
      var throwaway;
      function createSprite(location, type, addit) {
        return new Sprite(type, location.x, location.y, addit);
        console.log("Sprite created!");
      }
      function init() {
        createSprite(loc([0, 0]), "human", {
          behavior: "moveRandom",
        });
        for (let i = 0; i < Math.floor(Math.random() * 164); i++) {
          createSprite(
            loc([Math.floor(Math.random() * 30), Math.random() * 30]),
            "plant",
            {},
          );
        }

        console.log("Game initialized!");
      }
      init();
      setInterval(function () {
        // ...existing code...
        co2.push(
          createSprite(loc(sprites[0]), "co2", {
            behavior: "moveRight",
          }),
        );
 if (o2.length > 0) {
          o2[o2index].remove();
          o2index = (o2index + 1) % o2.length;
          o2count--;
        }
        // ...existing code...

        if (co2.length > 0) {
          co2[co2index].remove();
          co2index = (co2index + 1) % co2.length;
          co2count--;
        }

        if (n2count <= 78) {
          n2count++;
        }

        // ...existing code...        co2count++;
        o2count -= 0.5;
        n2count -= 0.5;

        var fn = function () {
          for (let i of sprites) {
            if (!i) {
              return;
            }
            if (i.addit && i.addit.behavior) {
              switch (i.addit.behavior) {
                case "moveRight":
                  i.x++;
                  $("#" + i.id).css("left", 16 * i.x + "px");
                  console.log("motion");
                  break;
                case "moveRandom":
                  switch (Math.floor(Math.random() * 4)) {
                    case 0:
                      i.x++;
                      $("#" + i.id).css("left", 16 * i.x + "px");
                      console.log("motion");
                      break;
                    case 1:
                      i.x--;
                      $("#" + i.id).css("left", 16 * i.x + "px");
                      console.log("motion");

                      i.y++;
                      $("#" + i.id).css("top", 16 * i.y + "px");
                      console.log("motion");
                      break;
                      i.y--;
                      $("#" + i.id).css("left", 16 * i.y + "px");
                      console.log("motion");
                      break;
                  }
                  break;
              }
            }
            if (!i.addit) {
              console.error(i);
            }
            if (i.type == "plant") {
              if (o2count < 21) {
                o2count++;
                o2.push(
                  createSprite(loc(i), "oxygen", {
                    behavior: "moveRandom",
                  }),
                );
              }
              
              co2count--;
              if (n2count <= 78) {
                n2count++;
      
              }
            }
          }
        };
        fn();
        $("#o2count").text(o2count);
        $("#co2count").text(co2count);
        $("#n2count").text(n2count);
      }, 1000);
    </script>
  </body>
</html>
