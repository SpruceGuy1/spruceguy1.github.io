      function getNeighbors(index, pgs) {
        const neighbors = [];
        const row = Math.floor(index / pgs);
        const col = index % pgs;

        for (let r = row - 1; r <= row + 1; r++) {
          for (let c = col - 1; c <= col + 1; c++) {
            if (
              r >= 0 &&
              r < pgs &&
              c >= 0 &&
              c < pgs &&
              !(r === row && c === col) &&
              Math.abs(r - row) + Math.abs(c - col) <= 1
            ) {
              neighbors.push(r * pgs + c);
            }
          }
        }

        return neighbors;

      function progress(dataArray) {
        const original = [...dataArray];
        const next = [...dataArray];
        const plantTiles = new Set("0123456789xy");

        for (let index = 0; index < original.length; index++) {
          const tile = original[index];
          if (tile !== "H" && tile !== "h") continue;

          const neighbors = getNeighbors(index, currentPGS);
          const treeTarget =[index + currentPGS, index + 1, index - currentPGS, index-1].find(function(c){
            return (neighbors.includes(c) && original[c] == "T" && next[c] == "T");
          })
          const target = [
            index + currentPGS, // down
            index + 1, // right
            index - currentPGS, // up
            index - 1, // left
          ].find(
            (candidate) =>
              neighbors.includes(candidate) &&
              plantTiles.has(original[candidate]) &&
              plantTiles.has(next[candidate]),
          );
          if(treeTarget !== undefined){
            next[index] = "H"; // H and h become H when eating a tree, restoring health.
            next[treeTarget] = "t"; // Trees lose leaves when eaten, but can grow them back.
            grow[treeTarget] = false; // Don't immediately grow leaves back
          }
          else

          if (target !== undefined) {
            next[index] = "_";
            next[target] = "H"; // Eating restores a low-health herbivore.
          }
        }
        let next0 = [...next];
        for (let index = 0; index < next.length; index++) {
          //sprouts become plants, OS0123456789x become S0123456789xy, y becomes t, t becomes T
          const tile = next[index];
          if (!"OS0123456789xytT".includes(tile)) continue;
          if(!grow[index]){
            grow[index] = true
            continue
          }
          if (tile == "y") next0[index] = "t";
          else if (tile == "t") next0[index] = "T";
          else if (tile == "O") next0[index] = "S";
          else if (tile == "S") next0[index] = "0";
          else if (tile == "T") continue;
          else {
            const num = parseInt(tile);
            if (num < 9) next0[index] = (num + 1).toString();
            else if (num == 9) next0[index] = "x";
            else if (tile == "x") next0[index] = "y";
            for (let neighbor of getNeighbors(index, currentPGS)) {
              if (next[neighbor] == "_") {
                next0[neighbor] = "S"; //sprout grows in empty tile next to plant. up to 4 sprouts can grow from one plant
              }
            }
          }
        }
        loadData(next0);
        render(document.getElementById("render"), scene.data, {
          pixelGrid: true,
          pgs: currentPGS,
        });
        return next0;
      }
