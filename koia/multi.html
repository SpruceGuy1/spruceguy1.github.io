<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/eruda"></script>

    <script>
      eruda.init();
    </script>
    <title>Koia Multi</title>
  </head>
  <body>
    <select id="lang">
      <option value="en">English</option>
      <option value="tok-las">toki pona kepeken sitelen Lasina</option>
      <option value="tok-sit">
        <span class="sit">toki-pona kepeken sitelen pona</span>
      </option>
      <option value="fbz">Ferbëzane</option>
    </select>
    <div id="render"></div>
    <button id="start">Start game</button>
    <button id="openlogin">Log In or Sign Up</button>
    
      <div id="goog">
        <form id="login">
          <label>
            Login Email
            <input id="log-email" type="email" required />
          </label>
          <label>
            Password
            <input id="log-pword" type="password" required />
          </label>
          <button id="login-submit" type="submit" disabled>Log In</button>
        </form>

        <form id="register">
          <label>
            Register Email
            <input id="reg-email" type="email" required />
          </label>
          <label>
            Password
            <input id="reg-pword" type="password" required />
          </label>
          <button id="register-submit" type="submit" disabled>Register</button>
        </form>
        <button id="save-btn" type="button" disabled>
          Save Progress To Your Account
        </button>
        <button id="load-btn" type="button" disabled>
          Get Your Saved Progress
        </button>
      </div>
      <div id="sub">
      <h3 id="header"></h3>
      <button id="attack">Attack</button>
      <button id="use">Use</button>
      <button id="swap">Swap offhand</button>
      <button id="sec">Secondary use</button>
      <div id="item1">
        <span id="i1text"></span>
        <div id="i1image"></div>
      </div>
      <div id="item5">
        <span id="offhand">Item 5 (Offhand)</span>
        <span id="i5text"></span>
        <div id="i5image"></div>
      </div>

      <table id="mot">
        <tr>
          <td></td>
          <td>&uarr;</td>
          <td></td>
        </tr>
        <tr>
          <td>&larr;</td>
          <td></td>
          <td>&rarr;</td>
        </tr>
        <tr>
          <td></td>
          <td>&darr;</td>
          <td></td>
        </tr>
        <tr>
          <td id="item2"></td>
          <td id="item3"></td>
          <td id="item4"></td>
        </tr>
      </table>
    </div>
  </body>

  <script type="module">
    import { translator } from "./translator.js";
    import { koia_multi_tsl } from "./translators/multi.js";
    import { Scene, render, animate } from "./renderer.js";
    const { initializeApp } =
      await import("https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js");
    const {
      getAuth,
      onAuthStateChanged,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
    } =
      await import("https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js");
    const { getFirestore, doc, setDoc, getDoc } =
      await import("https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js");

    const firebaseConfig = {
      apiKey: "AIzaSyAeINE31darFq72BB4N1WtWDARk9YPxJzY",
      authDomain: "sapient-origin-462411-t7.firebaseapp.com",
      projectId: "sapient-origin-462411-t7",
      storageBucket: "sapient-origin-462411-t7.firebasestorage.app",
      messagingSenderId: "749880999520",
      appId: "1:749880999520:web:9246df43f9ecb2279fcd05",
      measurementId: "G-2HT9YKBXV4",
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const status = document.getElementById("status");

    const dateFormat = document.getElementById("date-format");
    const saveButton = document.getElementById("save-btn");
    const loadButton = document.getElementById("load-btn");
    const loginSubmitButton = document.getElementById("login-submit");
    const registerSubmitButton = document.getElementById("register-submit");
    let currentUser = null;

    function showFirebaseError(action, error) {
      console.error(`${action} failed:`, error);
      status.textContent = `${action} failed. Please try again.`;
    }

    function getSaveData() {
      return {
        version: 1,
        multi_data: {
          player: player,
        },
        lastSaved: new Date().toISOString(),
      };
    }

    function applySaveData(data) {
      if (data?.version !== 1 || !data.player) {
        throw new Error("invalid-save-data");
      }
      player = data.player;
    }

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const signedIn = Boolean(user);
      loginSubmitButton.disabled = false;
      registerSubmitButton.disabled = false;
      saveButton.disabled = !signedIn;
      loadButton.disabled = !signedIn;
      status.textContent = signedIn
        ? `Signed in as ${user.email}.`
        : "Not signed in.";
    });

    document
      .getElementById("register")
      .addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          const credential = await createUserWithEmailAndPassword(
            auth,
            document.getElementById("reg-email").value,
            document.getElementById("reg-pword").value,
          );
          status.textContent = `Registered as ${credential.user.email}.`;
        } catch (error) {
          showFirebaseError("Registration", error);
        }
      });

    document
      .getElementById("login")
      .addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          const credential = await signInWithEmailAndPassword(
            auth,
            document.getElementById("log-email").value,
            document.getElementById("log-pword").value,
          );
          status.textContent = `Signed in as ${credential.user.email}.`;
        } catch (error) {
          showFirebaseError("Login", error);
        }
      });

    saveButton.addEventListener("click", async () => {
      if (!currentUser) return;
      status.textContent = "Saving progress...";
      try {
        await setDoc(doc(db, "multi_saves", currentUser.uid), getSaveData());
        status.textContent = "Progress saved.";
      } catch (error) {
        showFirebaseError("Save", error);
      }
    });

    loadButton.addEventListener("click", async () => {
      if (!currentUser) return;
      status.textContent = "Loading progress...";
      try {
        const snapshot = await getDoc(doc(db, "multi_saves", currentUser.uid));
        if (!snapshot.exists()) {
          status.textContent = "No saved progress found.";
          return;
        }
        applySaveData(snapshot.data());
        status.textContent = "Progress loaded.";
      } catch (error) {
        if (error.message === "invalid-save-data") {
          status.textContent = "Saved progress is invalid.";
        } else {
          showFirebaseError("Load", error);
        }
      }
    });
    $("#goog").hide();
    var loginOpen = false;
    $("#openlogin").click(function () {
      if (!loginOpen) {
        $("#goog").show();
        $("#openlogin").text("Hide login");
        loginOpen = true;
      } else {
        $("#goog").hide();
        $("#openlogin").text("Log In or Sign Up");
        loginOpen = false;
      }
    });
    var scenes = [{}];
    var currentScene = scenes[0];
    var player = { id: "rigbos", hp: 10 };
    $(
      'script[src="https://vercel.live/_next-live/feedback/feedback.js"]',
    ).remove();
    $("vercel-live-feedback").remove();
    var _AMBIENT = 2;
    var _TENSE = 0;
    var mood = "ambient";
    //ambient, tense,
    var s = new Scene({
      "kr-type": "2d-color",
      "kr-data": {},
    });
    render(document.getElementById("render"), s.data);
    const tsl = translator.init(koia_multi_tsl);
    function loadLang() {
      const clang = $("#lang").val();
      $("#header").html(tsl[clang]["header-default"]);
      //  attack use swap
      // sec offhand
      $("#attack").html(tsl[clang]["attack-button"]);
      $("#use").html(tsl[clang]["use-primary"]);
      $("#swap").html(tsl[clang]["swap-hands"]);
      $("#sec").html(tsl[clang]["use-secondary"]);
      $("#offhand").html(tsl[clang]["offhand"]);
      $("#start").html(tsl[clang]["start"]);
    }
    $("#lang").change(loadLang);
    loadLang();
    $("#start").click(function () {
      $("#start").remove();
      $("#render").append(
        "<img id='intro' src='/images/koia/multi-intro/0.png'/>",
      );

      var n = 0;
      var intro = setInterval(function () {
        if (n >= 10) {
          clearInterval(intro);
          setMusic(
            "/audio/multi-ambient-" +
              Math.floor(Math.random() * _AMBIENT) +
              ".m4a",
          );
        } else {
          n++;
          $("#intro").attr("src", "/images/koia/multi-intro/" + n + ".png");
        }
      }, 250);
    });
    window.currentMusic = null;
    function setMusic(selectedMusic) {
      if (selectedMusic === "none") {
        // Stop any currently playing music
        if (window.currentMusic) {
          window.currentMusic.pause();
          window.currentMusic.currentTime = 0;
          window.currentMusic = null;
        }
      }
      // Play standard music
      if (window.currentMusic) {
        window.currentMusic.pause();
        window.currentMusic.currentTime = 0;
      }
      window.currentMusic = new Audio(selectedMusic);
      window.currentMusic.loop = true;
      window.currentMusic.play();
    }
    window.currentMusic.addEventListener("ended", () => {
      console.log("Audio has finished playing.");
      if (!currentScene.audio) {
        switch (mood) {
          case "ambient":
            setMusic(
              "/audio/multi-ambient-" +
                Math.floor(Math.random() * _AMBIENT) +
                ".m4a",
            );
          case "tense":
            setMusic(
              "/audio/multi-tense-" +
                Math.floor(Math.random() * _TENSE) +
                ".m4a",
            );
        }
      }
      // Run your next action here
    });
  </script>
</html>
