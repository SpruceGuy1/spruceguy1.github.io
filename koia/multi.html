<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/eruda"></script>

    <script>
      eruda.init();
    </script>
    <title>Koia Multi</title>
  </head>
  <body>
    <h3 id="header"></h3>

    <select id="lang">
      <option value="en">English</option>
      <option value="tok-las">toki pona kepeken sitelen Lasina</option>
      <option value="tok-sit">
        <span class="sit">toki-pona kepeken sitelen pona</span>
      </option>
      <option value="fbz">Ferbëzane</option>
    </select>
    <div id="render"></div>
    <button id="attack">Attack</button>
    <button id="use">Use</button>
    <button id="swap">Swap offhand</button>
    <button id="sec">Secondary use</button>
    <div id="item1">
      <span id="i1text"></span>
      <div id="i1image"></div>
    </div>
    <div id="item5">
      <span id="offhand">Item 5 (Offhand)</span>
      <span id="i5text"></span>
      <div id="i5image"></div>
    </div>

    <table id="mot">
      <tr>
        <td></td>
        <td>&uarr;</td>
        <td></td>
      </tr>
      <tr>
        <td>&larr;</td>
        <td></td>
        <td>&rarr;</td>
      </tr>
      <tr>
        <td></td>
        <td>&darr;</td>
        <td></td>
      </tr>
      <tr>
        <td id="item2"></td>
        <td id="item3"></td>
        <td id="item4"></td>
      </tr>
    </table>
  </body>

  <script type="module">
    import { translator } from "./translator.js";
    import { koia_multi_tsl } from "./translators/multi.js";
    import { Scene, render, animate } from "./renderer.js";
    var s = new Scene({
      "kr-type": "2d-color",
      "kr-data": {},
    });
    render(document.getElementById("render"), s.data);
    const tsl = translator.init(koia_multi_tsl);
    $("#lang").change(() => {
      const clang = $("#lang").val();
      $("#header").html(tsl[clang]["header-default"]);
      //  attack use swap
      // sec offhand
      $("#attack").html(tsl[clang]["attack-button"]);
      $("#use").html(tsl[clang]["use-primary"]);
      $("#swap").html(tsl[clang]["swap-hands"]);
      $("#sec").html(tsl[clang]["use-secondary"]);
      $("#offhand").html(tsl[clang]["offhand"]);
    });
    $("#render").append(
      "<img id='intro' src='/images/koia/multi-intro/0.png'/>",
    );
    var n = 0;
    var intro = setInterval(function () {
      if (n >= 10) {
        clearInterval(intro);
      } else {
        n++;
        $("#intro").attr("src", "/images/koia/multi-intro/" + n + ".png");
      }
    }, 250);
  </script>
</html>
