      class Land {
        constructor(ogname, num) {
          this.num = num;

      class State {
        constructor(color, name, loc) {
          this.color = color;
          this.name = name;
          this.loc = loc;
          this.alliances = [];
          this.area = 1;
          this.land = [new Land(this.name, this.loc)];
          this.hasPort = false;
          this.gold = 0;
        }
        ally(n) {
          this.alliances.push(n.loc);
          n.alliances.push(this.loc);
        }
        transferGold(recipient, amount) {
          if (
            !recipient ||
            states[recipient.loc] !== recipient ||
            recipient === this ||
            !this.alliances.includes(recipient.loc) ||
            !Number.isFinite(amount) ||
            amount <= 0 ||
            this.gold < amount
          ) {
            return false;
          }

          this.gold -= amount;
          recipient.gold += amount;
          return true;
        }
        annex(selectedLand) {
          var defenderLoc = landOwners[selectedLand.num];
          var defender = states[defenderLoc];
          if (
            !defender ||
            defender === this ||
            this.alliances.includes(defender.loc)
          ) {
            return false;
          }

          var defenderLandIndex = defender.land.findIndex(
            (territory) => territory.num === selectedLand.num,
          );
          if (defenderLandIndex === -1) {
            return false;
          }

          var transferredLand = defender.land.splice(defenderLandIndex, 1)[0];
          this.land.push(transferredLand);
          defender.area = defender.land.length;
          this.area = this.land.length;
          landOwners[transferredLand.num] = this.loc;

          if (defender.area === 0) {
            states[defender.loc] = undefined;
            for (var state of states) {
              if (state) {
                state.alliances = state.alliances.filter(
                  (allyLoc) => allyLoc !== defender.loc,
                );
              }
            }
          }
          return true;
        }

      function getNeighboringCellIndices(index) {
        var row = Math.floor(index / 8);
        var column = index % 8;
        var neighbors = [];

        for (var rowOffset = -1; rowOffset <= 1; rowOffset++) {
          for (var columnOffset = -1; columnOffset <= 1; columnOffset++) {
            if (rowOffset === 0 && columnOffset === 0) {
              continue;
            }

            var candidateRow = row + rowOffset;
            var candidateColumn = column + columnOffset;
            if (
              candidateRow >= 0 &&
              candidateRow < 8 &&
              candidateColumn >= 0 &&
              candidateColumn < 8
            ) {
              neighbors.push(candidateRow * 8 + candidateColumn);
            }
          }
        }

        return neighbors;
      }
