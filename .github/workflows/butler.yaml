name: Upload to Itch
on: push

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build your game...

      - uses: robpc/itchio-upload-action@v1
        with:
          api-key: ${{ secrets.ITCH_API_KEY }}
          project: spruceguy/blocks
          channel: html5
          path: build
          version: ${{vars.VERSION}}
