name: Upload to Itch
on: push

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build your game...

      - uses: Oval-Tutu/publish-to-itch-with-butler@1.0.0
        with:
          api-key: ${{ secrets.ITCH_API_KEY }}
          itch_user: spruceguy
          itch_game: blocks
          channel: html5
          package: ./build/
          version: ${{vars.VERSION}}
